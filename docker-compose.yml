services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: extract
      POSTGRES_PASSWORD: extract
      POSTGRES_DB: extract
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extract -d extract"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://extract:extract@db:5432/extract
      EXTRACTOR_URL: http://extractor:8000
    depends_on:
      db:
        condition: service_healthy
      extractor:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/src

  extractor:
    build: ./extractor
    environment:
      EXTRACTOR_MODEL: stub
    volumes:
      - ./extractor:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata:

